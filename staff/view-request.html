<!DOCTYPE html>
<html lang="en">
<head>
    <title>Generate Quote</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="container">
    <div class="card">
        <h2>Quote Request #<span id="quoteId"></span></h2>
        <div id="toyDetails"></div>

        <form id="generateForm" class="hidden">
            <label for="price">Quote Price (HKD)</label>
            <input type="number" id="price" min="1" step="0.01" required>

            <label for="days">Estimated Delivery (days)</label>
            <input type="number" id="days" min="1" required>

            <button type="submit" class="btn btn-success">Send Quote</button>
        </form>
    </div>
</div>

<script src="../js/index.js"></script>
<script>
(function(){
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    let quotes = JSON.parse(localStorage.getItem('quotes') || '[]');
    const quote = quotes.find(q => q.id === id);

    if (!quote) {
        alert('Quote not found');
        history.back();
        return;
    }

    // Display toy details
    document.getElementById('quoteId').textContent = quote.id;
    document.getElementById('toyDetails').innerHTML = `
      <img src="${quote.toy.sketch}" width="200" alt="sketch"><br>
      <p><strong>Dimensions:</strong> ${quote.toy.dimensions}</p>
      <p><strong>Color:</strong> <span style="background:${quote.toy.pantone};width:30px;height:30px;display:inline-block;"></span></p>
      <p><strong>Materials:</strong> ${quote.toy.materials}</p>
      <p><strong>Quantity:</strong> ${quote.toy.quantity}</p>
    `;

    // Show form only if status is Submitted
    if (quote.status === 'Submitted') {
        document.getElementById('generateForm').classList.remove('hidden');
    }

    // === POINT 9: Submit Quote ===
    document.getElementById('generateForm').onsubmit = function(e) {
        e.preventDefault();
        const price = document.getElementById('price').value;
        const days = document.getElementById('days').value;

        quotes = quotes.map(q => q.id === id ? {
            ...q,
            status: 'Quoted',
            quote: { price: parseFloat(price), currency: 'HKD' },
            deliveryDate: new Date(Date.now() + days*86400000).toISOString().split('T')[0]
        } : q);

        localStorage.setItem('quotes', JSON.stringify(quotes));
        alert('Quote sent!');
        window.location.href = 'dashboard.html';
    };
})();
</script>
</body>
</html>
